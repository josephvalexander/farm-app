name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject git SHA into service worker
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/const CACHE_VERSION = '[^']*'/const CACHE_VERSION = 'vp-${SHA}'/" sw.js
          echo "Cache version set to: vp-${SHA}"

      - name: Commit updated sw.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          # Only commit if sw.js actually changed
          git diff --staged --quiet || git commit -m "chore: update cache version to vp-$(git rev-parse --short HEAD~1)"

      - name: Push
        run: git push
