<script>
// ── SERVICE WORKER — AUTO-UPDATE ──────────────────────────────────────────────
// New code pushed to GitHub → SW detects version change → silently downloads
// new files in background → silently reloads with new code.
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg=>{

    // 1. Check for update on every foreground return (catches new deploys)
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible') reg.update();
    });

    // 2. Also check once per hour in background
    setInterval(()=>reg.update(), 60*60*1000);

    // 3. When a new SW finishes installing, activate immediately — no user action
    const onNewWorker = worker => {
      worker.addEventListener('statechange',()=>{
        if(worker.state==='installed'){
          worker.postMessage({type:'SKIP_WAITING'});
        }
      });
    };

    reg.addEventListener('updatefound',()=>onNewWorker(reg.installing));
    if(reg.waiting){reg.waiting.postMessage({type:'SKIP_WAITING'});}
    if(reg.installing) onNewWorker(reg.installing);

  }).catch(()=>{});

  // 4. When SW takes control (after skipWaiting), reload to run new code
  let _reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!_reloading){_reloading=true;window.location.reload();}
  });

  // 5. SW sends SW_UPDATED message on activate — auto-update without banner
  //    (happens when app is in background and comes to foreground with new SW)
  navigator.serviceWorker.addEventListener('message',e=>{
    if(e.data?.type==='SW_UPDATED'){
      // Silent update already happened — just reload to pick up new files
      if(!_reloading){_reloading=true;window.location.reload();}
    }
  });
}

</script>
